name: Render designs

on:
  push:
    branches: ["design/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version && xcrun simctl list devices available | grep iPhone | head -20
      - name: Render screens
        run: scripts/render.sh renders
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: renders/
          if-no-files-found: warn
      - name: Publish renders to a branch
        if: success()
        run: |
          SRC_SHA=$(git rev-parse --short HEAD)
          OUT_BRANCH="renders/${GITHUB_REF_NAME}"
          mkdir -p /tmp/out && cp renders/*.png /tmp/out/
          cd /tmp/out
          git init -q -b "$OUT_BRANCH"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Renders for $SRC_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$OUT_BRANCH"
