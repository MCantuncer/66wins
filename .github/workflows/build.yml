name: Build app

on:
  push:
    branches: ["feature/**", "bugfix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project 66wins.xcodeproj -scheme 66wins -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|warning: .*Wins/|BUILD (SUCCEEDED|FAILED)" | head -200
